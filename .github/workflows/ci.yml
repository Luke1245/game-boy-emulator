name: build-test

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  build-test:
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - windows-latest

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v6 

      - run: cmake -S . -B build

      - run: cmake --build build

      - run: ctest --test-dir build --output-on-failure


